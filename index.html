<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container text-center">
    <h1>Agenda</h1>
  </div>
  <div class="container">
    <div class="container mb-5">
      <div class="row">
        <form id="contactForm">
          <div class="mb-3">
            <label class="form-label">Correo electronico</label>
            <input type="email" class="form-control" id="inputEmail" placeholder="Correo Electronico">
          </div>
          <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="inputName" placeholder="Nombre Completo">
          </div>
          <div class="mb-3">
            <label class="form-label">Telefono</label>
            <input type="tel" class="form-control" id="inputPhone" placeholder="Telefono">
          </div>
          <button type="submit" class="btn btn-primary" id="btnAdd">Enviar datos</button>
          <button type="button" class="btn btn-primary" id="btnUpdate">Actualizar datos</button>

        </form>
      </div>
      <hr>
      <table class="table table-bordered" id="tableData">
        <thead>
          <tr>
            <th>Correo</th>
            <th>Nombre completo</th>
            <th>Telefono</th>
            <th>Acciones</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>



  <script src="main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
</body>

</html>
